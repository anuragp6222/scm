<!DOCTYPE html>
<html
  lang="en"
  data-th-replace="~{base :: parent(~{::#content},~{::title},~{::script})}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${loggedInUser.name} +' | Contacts'"></title>
  </head>

  <div id="content">
    <!-- sidebar when user is  logged in  -->
    <div th:if="${loggedInUser}">
      <div data-th-replace="~{user/sidebar :: sidebar}"></div>
    </div>

    <div class="sm:pl-64">
      <div class="">
        <h1 class="text-4xl text-center">Welcome to Contact Page</h1>
        <p class="p-2">List of all your Contacts</p>
        <div class="contacts_container p-5">
          <div class="relative p-5 overflow-x-auto shadow-md sm:rounded-lg">
            <!-- form -->
            <form
              data-th-object="${contactSearchForm}"
              data-th-action="@{'/user/contacts/search'}"
            >
              <div
                class="flex space-x-3 items-center justify-start flex-column flex-wrap md:flex-row space-y-4 md:space-y-0 pb-4 bg-white dark:bg-gray-900"
              >
                <!-- select option box -->
                <div>
                  <select
                    data-th-field="*{fields}"
                    id="countries_disabled"
                    class="bg-gray-50 border items-center border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  >
                    <option selected value="">Select a Field</option>
                    <option value="name">Name</option>
                    <option value="phone">Phone</option>
                    <option value="email">Email</option>
                  </select>
                </div>

                <!-- search box -->
                <label for="table-search" class="sr-only">Search</label>
                <div class="relative">
                  <div
                    class="absolute inset-y-0 rtl:inset-r-0 start-0 flex items-center ps-3 pointer-events-none"
                  >
                    <svg
                      class="w-4 h-4 text-gray-500 dark:text-gray-400"
                      aria-hidden="true"
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 20 20"
                    >
                      <path
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
                      />
                    </svg>
                  </div>
                  <input
                    data-th-field="*{value}"
                    type="text"
                    id="table-search-users"
                    class="block p-2 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg w-80 bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    placeholder="Search for users"
                  />
                </div>
                <button
                  type="submit"
                  class="px-3 py-2 bg-gray-800 text-white rounded"
                >
                  Search
                </button>
              </div>
            </form>

            <!-- table content -->
            <table
              data-th-if="${pageContact.totalElements > 0}"
              class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400"
            >
              <thead
                class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400"
              >
                <tr>
                  <th scope="col" class="px-6 py-3">Name</th>
                  <th scope="col" class="px-6 py-3">Phone</th>
                  <th scope="col" class="px-6 py-3">Links</th>
                  <th scope="col" class="px-6 py-3">Favourite</th>
                  <th scope="col" class="px-6 py-3">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr
                  class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600"
                  data-th-object="${c}"
                  data-th-each="c : ${pageContact.getContent()}"
                >
                  <th
                    scope="row"
                    class="flex items-center px-6 py-4 text-gray-900 whitespace-nowrap dark:text-white"
                  >
                    <img
                      onerror="this.src='https://iconduck.com/icons/6491/profile-default'"
                      class="w-10 h-10 rounded-full"
                      data-th-src="@{*{picture}}"
                      src="/docs/images/people/profile-picture-1.jpg"
                      alt="Jese image"
                    />
                    <div class="ps-3">
                      <div
                        class="text-base font-semibold"
                        data-th-text="*{name}"
                      ></div>

                      <div
                        class="font-normal text-gray-500"
                        data-th-text="*{email}"
                      >
                        neil.sims@flowbite.com
                      </div>
                    </div>
                  </th>
                  <td class="px-6 py-4">
                    <i class="fa-solid fa-mobile-button"></i>
                    <span data-th-text="*{phoneNumber}"></span>
                  </td>
                  <td class="px-6 py-4">
                    <div class="flex items-center">
                      <a data-th-href="*{websiteLink}" target="_blank"
                        ><i class="fa-solid h-6 w-6 fa-link gap-1"></i>
                      </a>
                      <a data-th-href="*{linkedInLink}" target="_blank"
                        ><i class="fa-brands h-6 w-6 fa-linkedin-in ml-1"></i>
                      </a>
                    </div>
                  </td>
                  <td class="px-6 py-4 gap-2">
                    <div class="flex gap-2">
                      <div data-th-if="*{favourite}">
                        <i class="fa-solid h-6 w-6 fa-star"></i>
                      </div>
                      <div data-th-unless="*{favourite}">
                        <i class="fa-regular fa-star"></i>
                      </div>
                    </div>
                  </td>
                  <td class="px-6 py-4">
                    <a href="">
                      <i class="h-6 w-6 fa-solid fa-trash"></i>
                    </a>
                    <a href="">
                      <i class="h-6 w-6 fa-solid fa-pen-to-square"></i>
                    </a>
                    <button th:onclick="loadContactData([[${c.id}]])">
                      <i class="h-6 w-6 fa-solid fa-eye"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>

            <!-- Pagination Content -->
            <div
              data-th-if="${pageContact.totalElements > 0}"
              class="pagination_conatainer p-5"
            >
              <nav aria-label="Page navigation example">
                <ul class="inline-flex -space-x-px text-base h-10">
                  <li data-th-unless="${pageContact.first}">
                    <a
                      data-th-href="@{'/user/contacts?size=' + ${pageSize} + '&page=' + ${pageContact.number-1}}"
                      href="#"
                      class="flex items-center justify-center px-4 h-10 ms-0 leading-tight text-gray-500 bg-white border border-e-0 border-gray-300 rounded-s-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
                      >Previous</a
                    >
                  </li>
                  <li
                    data-th-each="index: ${#numbers.sequence(0,pageContact.totalPages-1)}"
                  >
                    <!-- classappend me issue hai properly load nahi ho rha ressolve krna hai -->
                    <a
                      data-th-href="@{'/user/contacts?size=' + ${pageSize} + '&page=' + ${index}}"
                      href="#"
                      data-th-classappend="${index==pageContact.number? 'bg-blue-50 dark:bg-gray-600' : 'bg-white dark:bg-gray-600'}"
                      class="flex items-center justify-center px-4 h-10 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
                      ><span data-th-text="${index+1}"></span
                    ></a>
                  </li>

                  <li data-th-unless="${pageContact.last}">
                    <a
                      data-th-href="@{'/user/contacts?size=' + ${pageSize} + '&page=' + ${pageContact.number+1}}"
                      href="#"
                      class="flex items-center justify-center px-4 h-10 leading-tight text-gray-500 bg-white border border-gray-300 rounded-e-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
                      >Next</a
                    >
                  </li>
                </ul>
              </nav>
            </div>
            <h1
              class="text-5xl text-center bg-white p-4"
              data-th-if="${pageContact.totalElements<=0}"
            >
              No result found
            </h1>
          </div>
        </div>
      </div>
      <div data-th-replace="~{user/contacts_modals :: contact}"></div>
    </div>
  </div>
  <script data-th-src="@{'/js/Contacts.js'}">
    console.log('contact modals loading')
  </script>
  <script>
    console.log('Profile page')
  </script>
</html>
